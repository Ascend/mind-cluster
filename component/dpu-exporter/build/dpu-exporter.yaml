apiVersion: v1
kind: Namespace
metadata:
  name: dpu-exporter
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: dpu-exporter-config
  namespace: dpu-exporter
data:
  config.json: |
    {
      "hinicadm5CollectorInterval": 40,
      "sysfsCollectorInterval": 20,
      "dpuListRefreshInterval": 60,
      "metricWhiteList": []
    }
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: dpu-exporter
  namespace: dpu-exporter
spec:
  selector:
    matchLabels:
      app: dpu-exporter
  template:
    metadata:
      ##### For Kubernetes versions lower than 1.19, seccomp is used with annotations.
      annotations:
        seccomp.security.alpha.kubernetes.io/pod: runtime/default
      labels:
        app: dpu-exporter
    spec:
      ##### For Kubernetes version 1.19 and above, seccomp is used with securityContext:seccompProfile
#      securityContext:
#        seccompProfile:
#          type: RuntimeDefault
      automountServiceAccountToken: false
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      nodeSelector:
        workerselector: dls-worker-node
      initContainers:
      - name: init-log-setup
        image: dpu-exporter:v26.2.0
        command: ['sh', '-c', 'mkdir -p /var/log/mindx-dl && chmod 755 /var/log/mindx-dl && chown root:root /var/log/mindx-dl && mkdir -p /var/log/mindx-dl/dpu-exporter && chmod 750 /var/log/mindx-dl/dpu-exporter && chown root:root /var/log/mindx-dl/dpu-exporter']
        securityContext:
          runAsUser: 0
          runAsNonRoot: false
        volumeMounts:
          - name: log-dpu-exporter
            mountPath: /var/log
      containers:
      - name: dpu-exporter
        image: dpu-exporter:v26.2.0
        imagePullPolicy: Never
        command: [ "/bin/bash", "-c", "--"]
        args: [ "umask 027;dpu-exporter -config=/etc/dpu-exporter/config.json" ]
        ports:
          - name: http
            containerPort: 8083
            protocol: TCP
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8083
            scheme: HTTP
          initialDelaySeconds: 10
          periodSeconds: 15
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /healthz
            port: 8083
            scheme: HTTP
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 3
        resources:
          requests:
            memory: 256Mi
            cpu: 500m
          limits:
            memory: 512Mi
            cpu: 1000m
        securityContext:
          privileged: true
          readOnlyRootFilesystem: true
          runAsUser: 0
          runAsGroup: 0
        volumeMounts:
          - name: config
            mountPath: /etc/dpu-exporter
            readOnly: true
          - name: localtime
            mountPath: /etc/localtime
            readOnly: true
          - name: tmp
            mountPath: /tmp
          - name: logdir
            mountPath: /var/log/mindx-dl/dpu-exporter
          - name: hiniclogdir
            mountPath: /var/log/hinic5
          - name: hinicadm5-bin
            mountPath: /usr/sbin/hinicadm5
            readOnly: true
      volumes:
        - name: log-dpu-exporter
          hostPath:
            path: /var/log
        - name: config
          configMap:
            name: dpu-exporter-config
            items:
              - key: config.json
                path: config.json
            defaultMode: 0444
        - name: localtime
          hostPath:
            path: /etc/localtime
            type: File
        - name: tmp
          emptyDir: {}
        - name: logdir
          hostPath:
            path: /var/log/mindx-dl/dpu-exporter
            type: DirectoryOrCreate
        - name: hiniclogdir
          hostPath:
            path: /var/log/hinic5
            type: DirectoryOrCreate
        - name: hinicadm5-bin
          hostPath:
            path: /usr/sbin/hinicadm5
            type: File
---
apiVersion: v1
kind: Service
metadata:
  name: dpu-exporter
  namespace: dpu-exporter
  labels:
    app: dpu-exporter
spec:
  type: ClusterIP
  clusterIP: None
  ports:
    - name: http
      port: 8083
      targetPort: 8083
      protocol: TCP
  selector:
    app: dpu-exporter
