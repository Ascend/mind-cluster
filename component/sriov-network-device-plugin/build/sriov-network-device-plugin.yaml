apiVersion: v1
kind: ServiceAccount
metadata:
  name: sriovdp-sa
  namespace: kube-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: sriovdp-cm-role
  namespace: kube-system
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "create", "update", "delete", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: sriovdp-cm-rb
  namespace: kube-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: sriovdp-cm-role
subjects:
  - kind: ServiceAccount
    name: sriovdp-sa
    namespace: kube-system
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: sriovdp-config
  namespace: kube-system
data:
  config.json: |
    {
      "resourceList": [
        {
          "resourceName": "ub-sriov-vf",
          "resourcePrefix": "huawei.com",
          "selectors": [{
            "buses": ["ub"],
            "vendors": ["0xcc08"],
            "devices": ["0x8200"],
            "isRdma": true
          }]
        }
      ]
    }
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: sriovdp-ds
  namespace: kube-system
spec:
  selector:
    matchLabels:
      name: sriovdp-ds
  template:
    metadata:
      labels:
        name: sriovdp-ds
    spec:
      hostNetwork: true
      priorityClassName: system-node-critical
      serviceAccountName: sriovdp-sa
      nodeSelector:
        workerselector: dls-worker-node
      initContainers:
        - name: init-log-setup
          image: sriovdp:v26.2.0
          command: ['sh', '-c', 'mkdir -p /var/log/mindx-dl/sriovdp && chmod 755 /var/log/mindx-dl/sriovdp']
          securityContext:
            runAsUser: 0
            runAsNonRoot: false
          volumeMounts:
            - name: log-host
              mountPath: /var/log
      containers:
        - image: sriovdp:v26.2.0
          name: k8s-sriovdp-ds
          imagePullPolicy: IfNotPresent
          securityContext:
            privileged: true
            readOnlyRootFilesystem: false
          command: ["/bin/bash", "-c", "--"]
          args: ["sriovdp"]
          volumeMounts:
            - name: device-plugin
              mountPath: /var/lib/kubelet/device-plugins
            - name: sys
              mountPath: /sys
            - name: infiniband
              mountPath: /dev/infiniband
            - name: log-sriovdp
              mountPath: /var/log/mindx-dl/sriovdp
            - name: hinicadm5
              mountPath: /usr/sbin/hinicadm5
              readOnly: true
            - name: hinic-log
              mountPath: /var/log/hinic5
            - name: config-volume
              mountPath: /etc/pcidp
              readOnly: true
            - name: tmp-volume
              mountPath: /tmp
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          resources:
            requests:
              memory: 500Mi
              cpu: 500m
            limits:
              memory: 500Mi
              cpu: 500m
      volumes:
        - name: device-plugin
          hostPath:
            path: /var/lib/kubelet/device-plugins
        - name: sys
          hostPath:
            path: /sys/
        - name: infiniband
          hostPath:
            path: /dev/infiniband/
        - name: log-host
          hostPath:
            path: /var/log
            type: Directory
        - name: log-sriovdp
          hostPath:
            path: /var/log/mindx-dl/sriovdp
            type: DirectoryOrCreate
        - name: hinicadm5
          hostPath:
            path: /usr/sbin/hinicadm5
            type: File
        - name: hinic-log
          hostPath:
            path: /var/log/hinic5
            type: DirectoryOrCreate
        - name: config-volume
          configMap:
            name: sriovdp-config
            items:
              - key: config.json
                path: config.json
        - name: tmp-volume
          emptyDir: {}
