apiVersion: v1
kind: ServiceAccount
metadata:
  name: ascend-dra-driver-service-account
  namespace: kube-system
  labels:
    app.kubernetes.io/name: ascend-dra-driver
    app.kubernetes.io/instance: ascend-dra-driver
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: ascend-dra-driver-role
rules:
- apiGroups: ["resource.k8s.io"]
  resources: ["resourceclaims"]
  verbs: ["get"]
- apiGroups: [""]
  resources: ["nodes"]
  verbs: ["get"]
- apiGroups: ["resource.k8s.io"]
  resources: ["resourceslices"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: ascend-dra-driver-role-binding
subjects:
- kind: ServiceAccount
  name: ascend-dra-driver-service-account
  namespace: kube-system
roleRef:
  kind: ClusterRole
  name: ascend-dra-driver-role
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: ascend-dra-driver-kubeletplugin
  namespace: kube-system
  labels:
    app.kubernetes.io/name: ascend-dra-driver
    app.kubernetes.io/instance: ascend-dra-driver
    app.kubernetes.io/component: kubeletplugin
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: ascend-dra-driver
      app.kubernetes.io/instance: ascend-dra-driver
      app.kubernetes.io/component: kubeletplugin
  updateStrategy:
    type: RollingUpdate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ascend-dra-driver
        app.kubernetes.io/instance: ascend-dra-driver
        app.kubernetes.io/component: kubeletplugin
    spec:
      priorityClassName: system-node-critical
      serviceAccountName: ascend-dra-driver-service-account
      securityContext: {}
      initContainers:
      - name: init-log-setup
        image: ascend-dra:v6.0.0
        imagePullPolicy: IfNotPresent
        command: ['/bin/bash', '-c']
        args:
        - |
          set -e
          mkdir -p /var/log/mindx-dl
          chmod 755 /var/log/mindx-dl
          chown root:root /var/log/mindx-dl
          mkdir -p /var/log/mindx-dl/ascend-dra
          chmod 750 /var/log/mindx-dl/ascend-dra
          chown root:root /var/log/mindx-dl/ascend-dra
        securityContext:
          runAsUser: 0
          runAsNonRoot: false
        volumeMounts:
        - name: dra-log
          mountPath: /var/log
      containers:
      - name: plugin
        securityContext:
          privileged: true
          capabilities:
            add: [ "SYS_PTRACE" ]
        image: ascend-dra:v6.0.0
        imagePullPolicy: IfNotPresent
        command: ["/bin/bash", "-c", "exec ascend-dra -logLevel=0 --enable-healthz --healthz-address=11251"]
        resources:
          requests:
            memory: 500Mi
            cpu: 500m
          limits:
            memory: 500Mi
            cpu: 500m
        livenessProbe:
          httpGet:
            path: /
            port: 11251
          initialDelaySeconds: 30
          failureThreshold: 3
          periodSeconds: 10
        env:
        - name: KUBELET_REGISTRAR_DIRECTORY_PATH
          value: "/var/lib/kubelet/plugins_registry"
        - name: KUBELET_PLUGINS_DIRECTORY_PATH
          value: "/var/lib/kubelet/plugins"
        - name: NODE_NAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
        - name: NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        volumeMounts:
        - name: plugins-registry
          mountPath: "/var/lib/kubelet/plugins_registry"
        - name: plugins
          mountPath: "/var/lib/kubelet/plugins"
        - name: cdi
          mountPath: /var/run/cdi
        - name: dra-log
          mountPath: /var/log/mindx-dl/ascend-dra
          subPath: mindx-dl/ascend-dra
          readOnly: false
        - name: ascend-dra-mounts
          mountPath: /etc/ascend-dra/mounts
          readOnly: false
        - name: host-dev
          mountPath: /hostRoot/dev
          readOnly: true
        - name: host-usr
          mountPath: /hostRoot/usr
          readOnly: true
        - name: host-var
          mountPath: /hostRoot/var
          readOnly: true
        - name: host-etc
          mountPath: /hostRoot/etc
          readOnly: true
        - name: hiai-driver
          mountPath: /usr/local/Ascend/driver
          readOnly: true
      volumes:
      - name: plugins-registry
        hostPath:
          path: "/var/lib/kubelet/plugins_registry"
      - name: plugins
        hostPath:
          path: "/var/lib/kubelet/plugins"
      - name: cdi
        hostPath:
          path: /var/run/cdi
      - name: dra-log
        hostPath:
          path: /var/log
          type: Directory
      - name: ascend-dra-mounts
        hostPath:
          path: /etc/ascend-dra/mounts
          type: DirectoryOrCreate
      - name: host-dev
        hostPath:
          path: /dev
      - name: host-usr
        hostPath:
          path: /usr
      - name: host-var
        hostPath:
          path: /var
      - name: host-etc
        hostPath:
          path: /etc
      - name: hiai-driver
        hostPath:
          path: /usr/local/Ascend/driver
---
apiVersion: resource.k8s.io/v1
kind: DeviceClass
metadata:
  name: npu.huawei.com
spec:
  selectors:
  - cel:
      expression: "device.driver == 'npu.huawei.com'"
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: resourceslices-policy-ascend-dra-driver
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
    - apiGroups:   ["resource.k8s.io"]
      apiVersions: ["v1beta1", "v1beta2", "v1"]
      operations:  ["CREATE", "UPDATE", "DELETE"]
      resources:   ["resourceslices"]
  matchConditions:
  - name: isRestrictedUser
    expression: >-
      request.userInfo.username == "system:serviceaccount:kube-system:ascend-dra-driver-service-account"
  variables:
  - name: userNodeName
    expression: >-
      request.userInfo.extra[?'authentication.kubernetes.io/node-name'][0].orValue('')
  - name: objectNodeName
    expression: >-
      (request.operation == "DELETE" ? oldObject : object).spec.?nodeName.orValue("")
  validations:
  - expression: variables.userNodeName != ""
    message: >-
      no node association found for user, this user must run in a pod on a node and ServiceAccountTokenPodNodeInfo must be enabled
  - expression: variables.userNodeName == variables.objectNodeName
    messageExpression: >-
      "this user running on node '"+variables.userNodeName+"' may not modify " +
      (variables.objectNodeName == "" ?"cluster resourceslices" : "resourceslices on node '"+variables.objectNodeName+"'")
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: resourceslices-policy-ascend-dra-driver
spec:
  policyName: resourceslices-policy-ascend-dra-driver
  validationActions: [Deny]
  # All ResourceSlices are matched.
