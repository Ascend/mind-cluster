# agent-core: diagnosis agent (Deployment).
# Build wheel: python -m pip wheel --no-deps --wheel-dir dist .
# Entry point after install:
#   HTTP : uvicorn agent_core.main:app --host 0.0.0.0 --port <port>
[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-core"
version = "26.2.0"
description = "ascend-clusterops-agent: diagnosis agent (agent-core)"
requires-python = ">=3.10"
dependencies = [
  "grpcio>=1.60.0",
  "protobuf>=4.25",
  "pyyaml>=6.0",
  "pydantic>=2.0",  # model_fields/model_json_schema: the contract drift gate relies on the v2 API
  "kubernetes>=29.0.0",
  "fastapi>=0.110.0",
  "uvicorn>=0.29.0",
  # langchain 1.x owns the ReAct graph now (chat/graph.py calls langchain.agents.create_agent,
  # the successor of the deprecated langgraph.prebuilt.create_react_agent) and needs Python 3.10+.
  "langchain>=1.0",
  "langgraph>=1.0",
  "langchain-openai>=1.0",
]

[tool.setuptools]
packages = [
  "agent_core",
  "agent_core.adapters",
  "agent_core.api",
  "agent_core.chat",
  "agent_core.datasources",
  "agent_core.datasources.clusterd",
  "agent_core.https",
  "agent_core.tools",
  "clusterops_common",
  "diagproto",
]

[tool.setuptools.package-dir]
# The source directory name (agent-core/) contains a hyphen and cannot be a Python package
# name; the project root is the package root, mapped to the valid package name agent_core.
# Subpackages are located through this parent mapping; do not add dotted keys here (unquoted
# dotted TOML keys become nested tables and conflict with the scalar agent_core value).
agent_core = "."
# Shared common code (logging etc.) and gRPC stubs are embedded into the component wheel.
clusterops_common = "../common"
diagproto = "../common/diagproto"

[tool.setuptools.package-data]
# Static payload only: the WebUI assets and the built-in skill bodies.
agent_core = [
  "webui/*.html",
  "webui/*.css",
  "webui/*.js",
  "webui/views/*.js",
  "skills/*/SKILL.md",
  "skills/README.md",
]
